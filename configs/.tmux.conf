##### БАЗА И СОВМЕСТИМОСТЬ #####
# 256-цветов + truecolor (iTerm2)
set -g default-terminal "xterm-256color"
set -as terminal-overrides ",*:Tc"

##### УПРАВЛЕНИЕ И УДОБСТВА #####
# Prefix: по умолчанию C-b, можно переключить на C-a (раскомментируй 3 строки ниже)
# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix

# Мышь: клики по панелям/окнам, прокрутка
set -g mouse on

# История побольше
set -g history-limit 100000

# Время escape для плавной работы Alt-комбинаций
set -s escape-time 10

# Копирование в стиле Vim в copy-mode
# setw -g mode-keys vi

# Буфер обмена macOS: копирование из tmux сразу в pbcopy
set -s set-clipboard on
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"

# Выделение мышью -> в системный буфер
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

##### ОКНА И ПАНЕЛИ #####
# Горячие клавиши сплитов
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Быстрая навигация по панелям (Alt + h/j/k/l)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Ресайз панелей (Alt + Shift + h/j/k/l)
bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5

# Нумерация окон с 1
set -g base-index 1
setw -g pane-base-index 1

##### СТАТУС-БАР #####
set -g status on
set -g status-interval 2
set -g status-left-length 40
set -g status-right-length 120

# Минималистичная тема
set -g status-style "bg=black,fg=white"
setw -g window-status-current-format " #I:#W* "
setw -g window-status-format " #I:#W "

set -g status-left "#[bold]#S #[default]"
set -g status-right "%Y-%m-%d %H:%M "

##### РАЗНОЕ #####
# Перезагрузка конфига: Prefix + r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
